<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CivicLen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #244f3b;
            --text: #20372b;
            --muted: #7d8b80;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background:
                radial-gradient(ellipse at 12% 10%, #e2eddf, transparent 42%),
                linear-gradient(135deg, #f7f8f2, #e9efe6);
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            padding: 48px 42px;
            background: #ffffff;
            border: 1px solid rgba(36, 79, 59, 0.09);
            border-radius: 24px;
            box-shadow: 0 25px 65px rgba(31, 64, 44, 0.12);
            animation: appear 0.6s ease both;
        }

        .brand {
            margin-bottom: 42px;
            color: var(--green);
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.7px;
        }

        .brand span {
            color: #78a77b;
        }

        .icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 25px;
            border-radius: 17px;
            background: #eaf2e9;
            color: var(--green);
            font-size: 27px;
        }

        .eyebrow {
            margin-bottom: 10px;
            color: #6b9270;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 12px;
            color: var(--text);
            font-size: 29px;
            letter-spacing: -0.8px;
        }

        .description {
            margin-bottom: 30px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #294438;
            font-size: 13px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 54px;
            padding: 14px 16px;
            border: 1px solid #dce6dc;
            border-radius: 11px;
            outline: none;
            background: #fbfcfa;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: 0.25s ease;
        }

        input:focus {
            border-color: #6b9270;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(107, 146, 112, 0.12);
        }

        .submit-button {
            width: 100%;
            min-height: 56px;
            margin-top: 22px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #244f3b, #315f48);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(36, 79, 59, 0.17);
            transition: 0.28s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(36, 79, 59, 0.23);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #315f48;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .back-link:hover {
            color: #173d29;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 9px;
            background: #edf5eb;
            color: #315f48;
            font-size: 13px;
            line-height: 1.6;
        }

        .message.show {
            display: block;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 38px 25px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="reset-card">

        <div class="brand">Civic<span>Len</span></div>

        <div class="icon">↻</div>

        <div class="eyebrow">Account Recovery</div>

        <h1>Forgot Password?</h1>

        <p class="description">
            No worries! Enter the email address associated with
            your CivicLen account to reset your password.
        </p>

        <form id="forgot-form">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <button type="submit" class="submit-button">
                Continue
            </button>

        </form>

        <div class="message" id="message" role="alert"></div>

        <a href="/login" class="back-link">
            ← Back to Sign In
        </a>

    </main>

    <script>
    const forgotForm = document.getElementById("forgot-form");
    const message = document.getElementById("message");
    const submitButton = forgotForm.querySelector("button");

    forgotForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.classList.remove("show");
        message.replaceChildren();

        const email = document.getElementById("email").value.trim();

        submitButton.disabled = true;
        submitButton.textContent = "Processing...";

        try {
            const response = await fetch("/api/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            message.classList.add("show");

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message || "Something went wrong. Please try again.";

                return;
            }

            message.textContent = data.message + " ";

            const link = document.createElement("a");

            link.href = data.reset_link;
            link.textContent = "Open Reset Password Page";
            link.style.display = "block";
            link.style.marginTop = "10px";
            link.style.color = "#244f3b";
            link.style.fontWeight = "700";

            message.appendChild(link);

        } catch (error) {
            message.classList.add("show");
            message.textContent =
                "Could not connect to the server. Please try again.";

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Continue";
        }
    });
</script>

</body>
</html>
