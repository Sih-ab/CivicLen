
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicLen | Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            padding: 40px 20px;
            color: #173b35;
        }

        .card {
            max-width: 480px;
            margin: 30px auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 { margin-top: 0; }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccd5d3;
            border-radius: 7px;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #17483e;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 18px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CivicLen Admin</h1>
        <p>Create an Authority account.</p>

        <form id="authority-form">
            <label for="full_name">Authority User's Full Name</label>
            <input id="full_name" name="full_name"
                   maxlength="100" required>

            <label for="email">Authority Login Email</label>
            <input id="email" name="email"
                   type="email" maxlength="254" required>

            <label for="password">Temporary Password</label>
            <input id="password" name="password"
                   type="password" minlength="8" required>

            <button id="submit-button" type="submit">
                Create Authority Account
            </button>
        </form>

        <p id="message" role="status"></p>
    </div>

    <script>
        const form = document.getElementById("authority-form");
        const message = document.getElementById("message");
        const button = document.getElementById("submit-button");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "Creating account...";
            button.disabled = true;

            const data = {
                full_name: form.full_name.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value
            };

            try {
                const response = await fetch("/api/admin/authorities", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.error || "Could not create account."
                    );
                }

                message.textContent =
                    "Authority account created successfully. User ID: "
                    + result.user_id;

                form.reset();

            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
